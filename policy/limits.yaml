# Spellings normalised. Any city not listed under X or Y is tier Z.
city_tiers:
  X: [Ahmedabad, Bengaluru, Chennai, Delhi, Hyderabad, Kolkata, Mumbai, Pune]
  Y: [Vijayawada, Warangal, Visakhapatnam, Guntur, Nellore, Guwahati, Patna, Chandigarh,
