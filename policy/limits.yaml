      Jhansi, Asansol, Siliguri, Durgapur]

limits:
  hotel_per_night:        # HTL-01, by grade then tier
    G1: {X: 4500, Y: 3500, Z: 2500}
    G2: {X: 6500, Y: 5000, Z: 3500}
    G3: {X: 9000, Y: 7000, Z: 5000}
  meals_per_day:          # MEAL-01
    G1: 1000
    G2: 1500
    G3: 2500
  local_transport_per_day:  # TRN-01; null = actuals
    G1: 1500
    G2: 2500
    G3: null
  client_entertainment_per_attendee: 3000   # ENT-01
  team_meal_per_head: 1000                  # ENT-02
  connectivity_per_trip: 500                # MISC-01
  laundry_min_nights: 4                     # HTL-04 (trip longer than 3 nights)
  business_class_min_flight_hours: 4        # AIR-01 (G3 only)
  advance_booking_days: 7                   # AIR-02
  late_night_after_hour: 22                 # TRN-02
  submission_window_days: 60                # GEN-02
  self_declaration_max_per_item: 500        # GEN-03
  self_declaration_max_per_month: 2         # GEN-03
  cash_single_payment_max: 10000            # GEN-05 (aligned with Income Tax Act s.40A(3))
  hotel_itc_review_threshold: 7500          # GST-03 (rooms at or below this per night -> tax team review)

non_reimbursable_items: [minibar, spa, salon, personal toiletries, movies, fines and penalties, loyalty or membership fees, gifts for self]

