      Thrissur, Malappuram, Kannur, Kollam, Gwalior, Indore, Bhopal, Jabalpur, Ujjain, Amravati,
      Nagpur, Aurangabad, Nashik, Bhiwandi, Solapur, Kolhapur, Vasai-Virar, Malegaon,
      Nanded-Waghala, Sangli, Cuttack, Bhubaneswar, Rourkela, Amritsar, Jalandhar, Ludhiana,
      Puducherry, Bikaner, Jaipur, Jodhpur, Kota, Ajmer, Salem, Tiruppur, Coimbatore,
      Tiruchirappalli, Madurai, Erode, Dehradun, Moradabad, Meerut, Ghaziabad, Aligarh, Agra,
